limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sse:10m;

server {
  listen 8080;
  server_tokens off;
  limit_req_status 429;
  limit_conn_status 429;

  # Re-resolve `backend` via Docker DNS so a restarted backend (new IP) is picked up without reloading nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3001;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location / {
    try_files $uri /index.html;
  }
  # `expires` (unlike add_header) keeps the security headers above inherited.
  location = /index.html { expires -1; }  # always revalidate: it points at the hashed bundles
  location /assets/      { expires 1y; }  # Vite fingerprints these filenames

  # Server-Sent Events: no buffering, long-lived, capped per client.
  location = /api/events {
    limit_conn sse 10;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
  }
}

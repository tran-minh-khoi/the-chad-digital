# For a VPS where nginx already runs other sites: add this as a NEW site file. It only matches
# its own server_name, so existing sites are not affected. Proxies to the backend on 127.0.0.1.
# Afterwards `sudo certbot --nginx -d <server_name>` adds the HTTPS block and certificate here.
server {
    listen 80;
    listen [::]:80;
    server_name api-interview-test.tranminhkhoi.dev;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # not $proxy_add_x_forwarded_for: clients cannot spoof it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                           # Server-Sent Events
        proxy_read_timeout 1h;
    }
}
